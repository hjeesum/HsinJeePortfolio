<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1600" height="1000" fill="#f3f4f6"/>
  <text x="50" y="90" font-size="34" font-weight="600" fill="#1f2937">How Grady works</text>
  <text x="50" y="132" font-size="24" fill="#6b7280">Runs every morning on GitHub Actions</text>

  <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
    <rect x="50" y="190" width="360" height="80" rx="10"/>
    <rect x="50" y="300" width="360" height="80" rx="10"/>
    <rect x="50" y="410" width="360" height="190" rx="10"/>
    <rect x="490" y="330" width="310" height="140" rx="10"/>
    <rect x="880" y="330" width="310" height="140" rx="10"/>
    <rect x="50" y="720" width="360" height="140" rx="10"/>
    <rect x="940" y="720" width="250" height="140" rx="10"/>
    <rect x="1290" y="720" width="260" height="140" rx="10"/>
  </g>
  <!-- The sponsor match is the core step, so it gets the accent. -->
  <rect x="490" y="720" width="370" height="140" rx="10" fill="#ffffff" stroke="#a04e08" stroke-width="3"/>
  <g fill="#ffffff" stroke="#d1d5db" stroke-width="2">
    <path d="M1290 345 v110 a130 22 0 0 0 260 0 v-110"/>
    <ellipse cx="1420" cy="345" rx="130" ry="22"/>
  </g>

  <g font-size="28" font-weight="600" fill="#1f2937" text-anchor="middle">
    <text x="230" y="240">Adzuna API</text>
    <text x="230" y="350">Reed API</text>
    <text x="230" y="455">Company careers sites</text>
    <text x="645" y="385">Fetch</text>
    <text x="1035" y="385">De-duplicate</text>
    <text x="1420" y="425">SQLite</text>
    <text x="230" y="775">UK sponsor register</text>
    <text x="675" y="775">Match company names</text>
    <text x="1065" y="775">Filter, sort, cap</text>
    <text x="1420" y="800">HTML email</text>
  </g>
  <g font-size="23" fill="#4b5563" text-anchor="middle">
    <text x="230" y="495">Greenhouse, Lever, Ashby,</text>
    <text x="230" y="527">SmartRecruiters, Workable,</text>
    <text x="230" y="559">Recruitee, Teamtailor, Workday</text>
    <text x="645" y="420">pagination, rate limits,</text>
    <text x="645" y="450">retries</text>
    <text x="1035" y="420">company + title</text>
    <text x="1035" y="450">+ location</text>
    <text x="230" y="815">gov.uk CSV, 143k rows</text>
    <text x="675" y="815">exact → unique prefix</text>
    <text x="675" y="845">→ fuzzy</text>
    <text x="1065" y="815">per profile</text>
  </g>

  <g stroke="#6b7280" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M410 230 L488 380"/>
    <path d="M410 340 L488 395"/>
    <path d="M410 505 L488 415"/>
    <path d="M800 400 H878"/>
    <path d="M1190 400 H1288"/>
    <path d="M1420 480 V620 H675 V718"/>
    <path d="M410 790 H488"/>
    <path d="M860 790 H938"/>
    <path d="M1190 790 H1288"/>
  </g>
</svg>
